# =============================================
# Hospital Management System — Spring Boot Config
# =============================================

# Application name
spring.application.name=HospitalManagementSystem

# Server port
server.port=8080

# =============================================
# H2 In-Memory Database Configuration
# =============================================
spring.datasource.url=jdbc:h2:mem:hmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Logging
# =============================================
logging.level.com.mycompany.hms=DEBUG
logging.level.org.springframework.web=INFO

# =============================================
# SpringDoc — Swagger UI + OpenAPI JSON (bonus)
# Swagger UI: http://localhost:8080/swagger-ui/index.html
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
